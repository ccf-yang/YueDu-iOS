name: 构建 YueDu-iOS IPA（无证书版）

on:
  workflow_dispatch:
  push:
    branches: [ bd ]
    paths-ignore:
      - '**.md'
      - '.github/**'

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build IPA on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout bd branch
        uses: actions/checkout@v4
        with:
          ref: bd

      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_17.2.app/Contents/Developer
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project YueDu-iOS.xcodeproj \
            -scheme YueDu-iOS \
            -clonedSourcePackagesDirPath ./SourcePackages

      - name: Build .app (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project YueDu-iOS.xcodeproj \
            -scheme YueDu-iOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -clonedSourcePackagesDirPath ./SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            EXCLUDED_ARCHS="armv7 armv7s" \
            BUILD_DIR="$PWD/build" \
            2>&1 | tee build.log | grep -E "(error:|warning:|BUILD)" || true
          if grep -q "BUILD FAILED" build.log; then
            echo "❌ Build failed:"
            grep "error:" build.log | head -40
            exit 1
          fi
          echo "✅ Build succeeded"

      - name: Package .app into IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build" -name "YueDu-iOS.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app"
            find "$PWD/build" -maxdepth 4 -type d
            exit 1
          fi
          echo "✅ 找到 .app: $APP_PATH"
          mkdir -p /tmp/Payload
          cp -r "$APP_PATH" /tmp/Payload/
          cd /tmp && zip -r YueDu-iOS-unsigned.ipa Payload/
          echo "✅ IPA 大小: $(du -sh YueDu-iOS-unsigned.ipa | cut -f1)"
          cp YueDu-iOS-unsigned.ipa "$GITHUB_WORKSPACE/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-iOS-unsigned-${{ github.run_number }}
          path: YueDu-iOS-unsigned.ipa
          retention-days: 90

      - name: Print download instructions
        run: |
          echo "🎉 IPA 构建成功！下载地址："
          echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "→ 页面底部 Artifacts → YueDu-iOS-unsigned-${{ github.run_number }}"
